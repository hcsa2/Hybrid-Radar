name: Backfill 2026 Year-to-Date
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/backfill.yml'
  schedule:
    - cron: '30 13 1 * *'
permissions:
  contents: write
concurrency:
  group: hybrid-radar-data
  cancel-in-progress: false
jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Collect year-to-date public reporting
        run: python scripts/update_ytd.py
      - name: Publish historical archive
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/ytd.json
          git diff --cached --quiet || (git commit -m 'Refresh year-to-date archive' && git pull --rebase && git push)
