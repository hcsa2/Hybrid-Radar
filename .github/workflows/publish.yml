name: Update Hybrid Radar
on:
  workflow_dispatch:
  schedule:
    - cron: '15 12 * * *'
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Refresh public news
        run: python scripts/update_feed.py
      - name: Friday digest
        run: |
          if [ "$(date -u +%u)" = "5" ]; then python scripts/update_weekly.py; fi
      - name: Commit feed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data
          git diff --cached --quiet || (git commit -m 'Refresh public news feed' && git push)
